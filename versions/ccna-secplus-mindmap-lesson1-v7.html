<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CCNA×Security+ 知識地圖 — Lesson 1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0f1512;
    --panel: #16201b;
    --panel-border: #24352c;
    --text: #e7f0ea;
    --text-dim: #9db3a6;
    --accent: #4CAF50;
    --accent-soft: #2e4a33;
    --related: #a78bfa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  #cy { flex: 1; height: 100vh; background: var(--bg); min-width: 0; }

  #sidebar {
    display: none;
    flex: 0 0 auto;
    max-width: 40vw;
    min-width: 300px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    padding: 20px;
    overflow-y: auto;
    flex-direction: column;
    gap: 14px;
  }
  #sidebar.visible { display: flex; }

  #topbar { position: absolute; top: 14px; left: 14px; z-index: 10; display: flex; gap: 8px; align-items: center; }
  #search { background: var(--panel); border: 1px solid var(--panel-border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; width: 220px; }
  #search:focus { outline: 1px solid var(--accent); }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 100px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); letter-spacing: 0.02em; width: fit-content; }
  h2#nodeTitle { margin: 0; font-size: 18px; line-height: 1.4; white-space: pre-line; }
  #nodeMeta { font-size: 12px; color: var(--text-dim); }
  #nodeContent { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; color: #d7e4dc; }

  .table-scroll { overflow-x: auto; max-width: 100%; }
  table.mdtable { border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  table.mdtable th, table.mdtable td { border: 1px solid var(--panel-border); padding: 6px 10px; text-align: left; vertical-align: top; white-space: nowrap; }
  table.mdtable th { background: var(--accent-soft); color: var(--accent); }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 6px; margin-top: 4px; }
  .rel-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .rel-btn { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .rel-btn.related-btn { background: #2c2440; border-color: var(--related); color: var(--related); }
  .rel-btn:hover { filter: brightness(1.2); }

  .icon-btn {
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #editBanner {
    display: none; font-size: 11px; color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: 6px; padding: 4px 10px; width: fit-content;
  }
  #editBanner.visible { display: block; }
  #cy.editing { box-shadow: inset 0 0 0 3px var(--accent); }

  .field-label { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; display: block; }
  .edit-input {
    width: 100%; background: #0f1512; border: 1px solid var(--panel-border); color: var(--text);
    padding: 7px 9px; border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .edit-input:focus { outline: 1px solid var(--accent); }
  textarea.edit-input { resize: vertical; min-height: 54px; line-height: 1.5; }
  .edit-row { display: flex; gap: 10px; align-items: flex-end; }
  .edit-row > div { flex: 1; }
  input[type="color"].edit-input { padding: 3px; height: 38px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div style="flex:1; position:relative; min-width:0;">
    <div id="topbar">
      <button class="icon-btn" id="lockBtn" title="切換編輯模式">🔒</button>
      <button class="icon-btn" id="exportBtn" title="匯出變更 JSON" disabled>⬇</button>
      <input id="search" placeholder="搜尋節點關鍵字..." />
      <span style="font-size:11px; color:var(--text-dim);">WASD 平移畫面　·　Ctrl+Z 復原</span>
    </div>
    <div id="cy"></div>
  </div>
  <div id="sidebar">
    <span id="editBanner">✎ 編輯模式：修改會即時套用到畫面上，記得最後按匯出</span>
    <span class="badge" id="nodeBadge"></span>
    <h2 id="nodeTitle"></h2>
    <div id="nodeMeta"></div>
    <div id="nodeContent"></div>
    <div class="table-scroll" id="tableWrap"></div>

    <div id="editPanel" style="display:none; flex-direction:column; gap:12px;">
      <div>
        <span class="field-label">名稱 Label（英文 → 中文 →（括號），換行分隔）</span>
        <textarea class="edit-input" id="editLabel" rows="3"></textarea>
      </div>
      <div>
        <span class="field-label">內文 Content</span>
        <textarea class="edit-input" id="editContent" rows="5"></textarea>
      </div>
      <div class="edit-row">
        <div>
          <span class="field-label">形狀 Shape</span>
          <select class="edit-input" id="editShape"></select>
        </div>
        <div>
          <span class="field-label">顏色 Color</span>
          <input class="edit-input" type="color" id="editColor" />
        </div>
        <div>
          <span class="field-label">大小 Size</span>
          <input class="edit-input" type="number" id="editSize" min="10" max="200" />
        </div>
      </div>
    </div>

    <div id="edgeEditPanel" style="display:none; flex-direction:column; gap:12px;">
      <div class="section-label">線段設定 Edge</div>
      <div class="edit-row">
        <div>
          <span class="field-label">curve-style</span>
          <select class="edit-input" id="edgeCurveStyle">
            <option value="bezier">bezier</option>
            <option value="straight">straight</option>
            <option value="unbundled-bezier">unbundled-bezier</option>
            <option value="taxi">taxi</option>
            <option value="round-taxi">round-taxi</option>
            <option value="segments">segments</option>
            <option value="haystack">haystack</option>
          </select>
        </div>
        <div>
          <span class="field-label">line-style</span>
          <select class="edit-input" id="edgeLineStyle">
            <option value="solid">solid</option>
            <option value="dashed">dashed</option>
            <option value="dotted">dotted</option>
          </select>
        </div>
      </div>
      <div class="edit-row">
        <div>
          <span class="field-label">width</span>
          <input class="edit-input" type="number" id="edgeWidth" min="0.5" max="20" step="0.5" />
        </div>
        <div>
          <span class="field-label">line-color</span>
          <input class="edit-input" type="color" id="edgeColor" />
        </div>
      </div>
      <div>
        <span class="field-label">label（線上文字）</span>
        <input class="edit-input" type="text" id="edgeLabel" />
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); cursor:pointer;">
        <input type="checkbox" id="edgeSyncColor" style="width:auto;" />
        與 parent node 同步顏色（節點改色時線段自動跟著變，手動改線段顏色會自動取消勾選）
      </label>
    </div>

    <div id="parentSection" style="display:none;">
      <div class="section-label">上層節點 Parent</div>
      <div class="rel-btns" id="parentBtns"></div>
    </div>
    <div id="childrenSection" style="display:none;">
      <div class="section-label">下層節點 Children</div>
      <div class="rel-btns" id="childrenBtns"></div>
    </div>
    <div id="relSection" style="display:none;">
      <div class="section-label">跨段落關聯 Related</div>
      <div class="rel-btns" id="relBtns"></div>
    </div>
  </div>
</div>

<script>
const GRAPH_DATA = [{"id": "l1-iaaa-accounting", "label": "Accounting\n可問責/稽核", "content": "記錄使用者存取資源和執行動作的過程，以便監控、追蹤和稽核。「有留下紀錄嗎？」", "table": "", "source": "p.18", "flow": 4, "parent": "l1-iaaa", "related": ["l1-nonrepud-vs-accountability"], "x": 1755.3, "y": 775.7, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-infosec", "label": "Information Security\n資訊安全", "content": "資訊安全的核心屬性通常稱為 CIA Triad：\n機密性、完整性、可用性。\n另外還有不可否認性(Non-repudiation)與真實性(Authenticity)兩個延伸屬性。", "table": "", "source": "p.5,7", "flow": null, "parent": "l1-topic1a", "related": [], "x": 828.4, "y": 472.4, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": ["l1-integrity", "l1-nonrepudiation", "l1-availability", "l1-authenticity", "l1-dad", "l1-confidentiality"]}, {"id": "l1-roles-executive", "label": "Executive Roles\n高階主管與資安總舵手\n（CEO/CISO/CIO）", "content": "高階主管(CEO/總經理)：負最終決策責任，核准資安預算與整體政策。\n資安長(CISO)：組織資安總舵手，制定整體資安戰略、風險評估，監控網路威脅。\n資訊長(CIO)：負責資訊系統架構與營運，確保技術發展符合資安標準。", "table": "", "source": "p.44", "flow": null, "parent": "l1-roles", "related": [], "x": 2769.8, "y": 659.1, "size": 40, "color": "#B39DDB", "shape": "round-rectangle", "children": []}, {"id": "l1-iaaa-authentication", "label": "Authentication\n驗證", "content": "證明主體在嘗試存取資源時確實是其聲稱的身份。例如：帳密登入、生物特徵、MFA。「證明給我看」", "table": "", "source": "p.18", "flow": 2, "parent": "l1-iaaa", "related": [], "x": 1610.6, "y": 778.3, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-iaaa-authorization", "label": "Authorization\n授權", "content": "確定主體對每種資源應擁有哪些權利，並執行這些權利。例如：管理者 vs 一般使用者。「你能做什麼？」", "table": "", "source": "p.18", "flow": 3, "parent": "l1-iaaa", "related": [], "x": 1683.6, "y": 778.3, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-preventive", "label": "Preventive\n預防性控制", "content": "從源頭阻止安全問題發生，目標是阻止威脅發生、消除或降低攻擊成功可能性，屬於主動防禦第一道防線。", "table": "範例：防火牆(技術)、帳號密碼/MFA(技術)、門禁系統(實體)、資料加密(技術)、安全意識訓練(管理)", "source": "p.33", "flow": 1, "parent": "l1-sc-functypes", "related": [], "x": 2226.5, "y": 669.4, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-nistcsf", "label": "NIST CSF\n五大核心功能", "content": "NIST制定的CSF涵蓋五個核心功能，\n依序為：識別→保護→檢測→回應→恢復，彼此間有回饋迴圈。", "table": "", "source": "p.12", "flow": null, "parent": "l1-csf", "related": [], "x": 1207.8, "y": 586.3, "size": 44, "color": "#9E9E9E", "shape": "ellipse", "children": ["l1-nist-respond", "l1-nist-detect", "l1-nist-identify", "l1-nist-protect", "l1-nist-recover"]}, {"id": "l1-sc-directive", "label": "Directive\n指令性控制", "content": "透過政策、規範、程序引導行為，屬於管理層面控制手段，告訴人員「應該做什麼」或「不能做什麼」，違反者通常面臨紀律處分。", "table": "範例：可接受使用政策、密碼政策、資料分類政策、保密協議(NDA)、社群媒體使用規範", "source": "p.39", "flow": null, "parent": "l1-sc-functypes", "related": [], "x": 2643.6, "y": 665.5, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-integrity", "label": "Integrity\n完整性", "content": "確保被使用的資料為正確資料，任何修改都必須經過授權。\n威脅：資料竄改、程式碼注入、密碼分析攻擊。\n防範：密碼學、Checksum、訊息摘要、數位簽章。", "table": "", "source": "p.8", "flow": null, "parent": "l1-infosec", "related": [], "x": 704.5, "y": 773.3, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-detective", "label": "Detective\n偵測性控制", "content": "能識別潛在安全漏洞以便進一步調查，可能不會阻止存取，但會識別並記錄任何企圖或成功的入侵，提供攻擊的可見性。", "table": "範例：IDS入侵偵測系統、監視攝影機CCTV、SIEM安全資訊事件管理、異常登入告警、系統日誌審查", "source": "p.34", "flow": 2, "parent": "l1-sc-functypes", "related": ["l1-competencies"], "x": 2287.2, "y": 669.2, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-managerial", "label": "Managerial\n管理控制", "content": "著重規劃、政策制定、風險管理，由高層管理人員主導，確保安全目標與組織目標一致。\n提供對整個系統的監督與治理，屬於政策與程序層面的控制。", "table": "範例：資訊安全政策（制定公司整體資安政策文件）、風險評估（定期進行風險評估與管理）、安全稽核（定期稽核系統安全合規性）、業務連續性計畫（制定災難復原計畫）", "source": "p.28", "flow": null, "parent": "l1-sc-categories", "related": [], "x": 2024.8, "y": 667.1, "size": 40, "color": "#2196F3", "shape": "triangle", "children": []}, {"id": "l1-nist-respond", "label": "Respond\n回應", "content": "識別、分析、遏制和消除對系統和數據安全的威脅。", "table": "", "source": "p.12", "flow": 4, "parent": "l1-nistcsf", "related": [], "x": 1272.8, "y": 777.6, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-soc", "label": "SOC\n安全運營中心\nSecurity Operations Center", "content": "安全專業人員監控和保護其他業務功能（財務、運營、銷售等）關鍵資訊資產的位置，專門用於監控、分析及緩解網路威脅的設施。\n負責收集並彙整來自不同環境（地端、雲端、混合雲）的安全訊息，以識別和回應潛在安全事件。\n由於難以建立、維護和融資，通常受僱於大公司，如政府機構或醫療保健公司。", "table": "", "source": "p.48-49", "flow": null, "parent": "l1-bizunits", "related": [], "x": 3154, "y": 656.5, "size": 40, "color": "#B39DDB", "shape": "round-rectangle", "children": []}, {"id": "l1-nist-detect", "label": "Detect\n檢測", "content": "執行持續、主動的監控，確保控制措施有效並能抵禦新型威脅。", "table": "", "source": "p.12", "flow": 3, "parent": "l1-nistcsf", "related": [], "x": 1207.8, "y": 776.3, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-nonrepudiation", "label": "Non-repudiation\n不可否認性", "content": "主體不能否認做過某事，例如創建、修改或發送資源。例如遺囑等法律文件簽署時通常需要見證人。\n常見技術手段：數位簽章、非對稱加密、時間戳記。", "table": "", "source": "p.7,19", "flow": null, "parent": "l1-infosec", "related": ["l1-nonrepud-vs-accountability"], "x": 983, "y": 774.6, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-seccontrols", "label": "Security Controls\n安全控制", "content": "為保護組織的資料、系統與資產，用來「預防、偵測、抵禦或最小化」資安風險所實施的各種保障措施與對策（政策、流程、軟硬體功能）。\n\n依實施類型分四種：管理、操作、技術、實體。\n依功能分六種：預防、偵測、矯正、指令、嚇阻、補償。", "table": "", "source": "p.26", "flow": null, "parent": "l1-topic1b", "related": [], "x": 2180.2, "y": 482.5, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": ["l1-sc-functypes", "l1-sc-categories"]}, {"id": "l1-devsecops", "label": "DevSecOps\n（開發+安全+運營）", "content": "將安全性完全整合至軟體開發(Dev)與營運(Ops)生命週期(SDLC)中的實務與文化。\n強調「資安左移(Shift Left)」，在開發初期就進行安全測試與合規掃描，大幅降低後期修復漏洞的成本與風險。\n核心原則：自動化整合(CI/CD嵌入自動化防護)、共同分擔的文化(打破開發/資安/營運的穀倉效應)。", "table": "SDLC流程：需求分析→軟體設計→軟體開發→測試和上線→維護與更新", "source": "p.50-51", "flow": null, "parent": "l1-bizunits", "related": [], "x": 3269.3, "y": 656.5, "size": 40, "color": "#B39DDB", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-ransomware-example", "label": "Ransomware Defense Example\n三種功能類型範例：勒索軟體防禦", "content": "預防：系統加固(System Hardening)從源頭防止感染。\n偵測：透過EDR(端點防護告警軟體)偵測勒索軟體並發出警報。\n校正：若已感染，需靠備份(一種恢復手段)復原資料。", "table": "", "source": "p.36", "flow": null, "parent": "l1-sc-functypes", "related": [], "x": 2401, "y": 778.1, "size": 34, "color": "#f82a2a", "shape": "round-rectangle", "children": []}, {"id": "l1-availability", "label": "Availability\n可用性", "content": "確保資訊服務隨時可用，無法使用資訊等於沒有資訊。\n威脅：DDoS攻擊、應用程式和元件故障。\n防範：入侵防禦/偵測系統、修補程式管理、冗餘機制。", "table": "", "source": "p.8", "flow": null, "parent": "l1-infosec", "related": [], "x": 769.6, "y": 772, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-nist-identify", "label": "Identify\n識別", "content": "制定安全政策和能力。評估風險、威脅和漏洞，並推薦安全控制措施以減輕它們。", "table": "", "source": "p.12", "flow": 1, "parent": "l1-nistcsf", "related": [], "x": 1071.1, "y": 778.9, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-deterrent", "label": "Deterrent\n嚇阻性控制", "content": "透過威嚇讓攻擊者降低或打消攻擊慾望，可能不會在實體或技術上阻止存取，但會在心理上阻止攻擊者嘗試入侵。與預防控制的差異：嚇阻靠心理，預防靠技術/實體阻擋。", "table": "範例：警告標語、監視攝影機(外顯)、安全警衛巡邏、警告燈號/警報系統標示、法律告示", "source": "p.40", "flow": null, "parent": "l1-sc-functypes", "related": [], "x": 2576.9, "y": 666.5, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-bizunits", "label": "Information Security Business Units (BU)\n資訊安全事業部", "content": "組織可能設立專責的資安業務單位來管理複雜的安全需求，例如SOC、DevSecOps、Incident Response(CIRT)。", "table": "", "source": "p.48", "flow": null, "parent": "l1-topic1b", "related": [], "x": 3264, "y": 466.5, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": ["l1-soc", "l1-devsecops", "l1-incidentresponse-bu"]}, {"id": "l1-sc-functypes", "label": "Security Control Functional Types\n安全控制功能類型\n（六種）", "content": "依時機與目的分為六種：\n預防(攻擊前)\n偵測(攻擊中)\n校正(攻擊後)\n指令(規範行為)\n嚇阻(心理威嚇)\n補償(替代方案)。\n前三者依攻擊時間軸排列，後三者是額外功能類型。\n\nDeterrent 與 Preventive 容易混淆——Deterrent 靠心理威嚇，Preventive 靠實際阻擋；而Compensating\n是在合規要求無法直接達成時才使用的彈性機制。", "table": "", "source": "p.32,38,42", "flow": null, "parent": "l1-seccontrols", "related": [], "x": 2347, "y": 546.7, "size": 44, "color": "#9E9E9E", "shape": "ellipse", "children": ["l1-sc-preventive", "l1-sc-directive", "l1-sc-detective", "l1-sc-ransomware-example", "l1-sc-deterrent", "l1-sc-compensating", "l1-sc-corrective"]}, {"id": "l1-csf", "label": "Cybersecurity Framework\n網路安全框架", "content": "一套標準化的方針、最佳實務與指南，協助組織建立、管理及強化網路安全防護能力。因為完美防禦不存在，資安本質上是風險管理決策，CSF提供通用語言評估安全成熟度。全球最廣泛採用標準為NIST CSF。\n其他資安框架：\n1. ISO/IEC 27001\n2. CIS Controls\n3. MITRE ATT&CK", "table": "| 框架 | 說明 |\n|---|---|\n| NIST CSF | 全球最廣泛採用 |\n| ISO/IEC 27001 | 全球公認ISMS標準，著重全面資安管理流程與認證 |\n| CIS Controls | CIS提出，18項關鍵安全防護清單 |\n| MITRE ATT&CK | 基於真實觀察的攻擊手法知識庫 |", "source": "p.10-11", "flow": null, "parent": "l1-topic1a", "related": [], "x": 1207.8, "y": 455.8, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": ["l1-nistcsf"]}, {"id": "l1-authenticity", "label": "Authenticity\n真實性", "content": "第五個資安屬性。當文件執行的正確性有爭議時，證人可提供證據證明其正確性。", "table": "", "source": "p.7", "flow": null, "parent": "l1-infosec", "related": [], "x": 907.4, "y": 773.3, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-operational", "label": "Operational\n操作控制", "content": "主要由人而非系統實施，圍繞日常活動和流程的執行展開，依賴人員來執行與實施。", "table": "範例：安全意識訓練（定期資安教育訓練）、實體巡邏（保全人員定期巡視機房）、事件回應程序（人員依SOP處理資安事件）、文件銷毀程序（依規定銷毀機密文件）", "source": "p.29", "flow": null, "parent": "l1-sc-categories", "related": [], "x": 2024.9, "y": 744.8, "size": 40, "color": "#2196F3", "shape": "barrel", "children": []}, {"id": "l1-topic1b", "label": "Topic 1B\nSecurity Controls", "content": "涵蓋安全控制措施的分類方式(管理/操作/技術/實體)、六種功能類型、資安角色職責、職能與業務單位。", "table": "", "source": "p.25", "flow": null, "parent": "l1-root", "related": [], "x": 2923.6, "y": 293, "size": 75, "color": "#FFFFFF", "shape": "round-hexagon", "children": ["l1-seccontrols", "l1-bizunits", "l1-roles", "l1-competencies"]}, {"id": "l1-dad", "label": "DAD\n（CIA三要素的對立面）", "content": "揭露(Disclosure)：未經授權的存取，對應機密性(Confidentiality)。\n更改(Alteration)：未經授權的變更資料，對應完整性(Integrity)。\n毀滅(Destruction)：資料或系統故障導致無法存取，對應可用性(Availability)。", "table": "", "source": "p.9", "flow": null, "parent": "l1-infosec", "related": [], "x": 828.4, "y": 899, "size": 40, "color": "#F44336", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-technical", "label": "Technical\n技術控制", "content": "以系統（硬體、軟體或韌體）形式實施，也可描述為邏輯控制。最大程度降低組織技術系統的漏洞。", "table": "範例：安裝防火牆、多因素驗證、防毒軟體、資料加密", "source": "p.30", "flow": null, "parent": "l1-sc-categories", "related": [], "x": 2058, "y": 818, "size": 40, "color": "#2196F3", "shape": "rhomboid", "children": []}, {"id": "l1-root", "label": "Lesson 1\n資安基礎概念", "content": "課程總覽：涵蓋資安核心概念（CIA Triad 等）與安全控制措施分類、資安角色與職能。", "table": "", "source": "SY0-701 Lesson1 p.1-2", "flow": null, "parent": null, "related": [], "x": 2049.1, "y": -5.3, "size": 100, "color": "#FFEB3B", "shape": "hexagon", "children": ["l1-topic1b", "l1-topic1a"]}, {"id": "l1-roles-nontech", "label": "Manager vs Technical vs Non-technical Roles\n經理／技術人員／非技術人員的職責分工", "content": "經理可能對某個領域(domain)負責，例如建築控制、網站服務或稽核。\n技術和專家人員(如ISSO)負責實施、維護和監控政策。\n非技術人員負責遵守政策和相關法規。", "table": "", "source": "p.45", "flow": null, "parent": "l1-roles", "related": [], "x": 2924.8, "y": 656.5, "size": 40, "color": "#B39DDB", "shape": "round-rectangle", "children": []}, {"id": "l1-accesscontrol", "label": "Access Control\n存取控制", "content": "控制主體(Subject)如何與客體(Object)互動的過程。\n主體可以是人、設備、軟體程序或其他系統；\n客體是被存取的資源，如網路、伺服器、資料庫、應用程式或檔案。\n決定誰(Who)可以存取什麼資源(What)、在什麼條件下(How)進行存取。", "table": "| 元素 | 說明 | 範例 |\n|---|---|---|\n| 主體 Subject | 發出存取請求的實體 | 使用者、程式、服務 |\n| 客體 Object | 被存取的目標資源 | 檔案、資料庫、網路 |\n| 政策 Policy | 決定是否允許存取的規則 | 角色權限、存取清單 |", "source": "p.15-17", "flow": null, "parent": "l1-topic1a", "related": ["l1-competencies"], "x": 1648.3, "y": 465.7, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": ["l1-iaaa", "l1-nonrepud-vs-accountability"]}, {"id": "l1-sc-physical", "label": "Physical\n實體控制", "content": "採用各種機制（鑰匙卡、生物識別、密碼）來規範和限制對設施內特定區域的存取，重點在保護組織的有形資產、設施和資源。", "table": "範例：門禁卡/生物辨識、監視攝影機(CCTV)、機架鎖、圍籬/保全閘門、防竄改貼紙", "source": "p.31", "flow": null, "parent": "l1-sc-categories", "related": [], "x": 1996.8, "y": 818, "size": 40, "color": "#2196F3", "shape": "right-rhomboid", "children": []}, {"id": "l1-incidentresponse-bu", "label": "Incident Response\n事件回應\n（CIRT）", "content": "專門的網路事件回應團隊(CIRT)，作為通知安全事件的單點聯繫人，此功能可能由SOC處理，也可能建立為獨立業務單位。\n核心任務為在駭客入侵或系統異常時迅速止血、控制災情，並協助企業從事故中安全復原。", "table": "IR生命週期：Preparation → Detection & Analysis → Containment/Eradication & Recovery → Post-Incident Activity（並回饋至 Detection & Analysis / Preparation）", "source": "p.52", "flow": null, "parent": "l1-bizunits", "related": [], "x": 3385.9, "y": 653.8, "size": 40, "color": "#B39DDB", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-compensating", "label": "Compensating\n補償性控制", "content": "作為主要控制的替代品，用於無法直接滿足某項安全要求時的替代方案，提供相同或更好的保護級別，但使用不同方法或技術，常見於合規框架中。", "table": "| 情境 | 原始控制 | 補償控制 |\n|---|---|---|\n| 舊型醫療設備無法加密 | 資料加密 | 網路隔離+嚴格存取控制 |\n| 工控系統無法安裝防毒 | 防毒軟體 | 應用程式白名單+網路分段 |\n| 系統要求MFA但系統不支援 | 多因素驗證 | 強化監控+限制存取IP範圍 |\n| 老舊系統無法定期更新 | 定期安全更新 | 額外防火牆規則+加強監控 |", "source": "p.41", "flow": null, "parent": "l1-sc-functypes", "related": [], "x": 2506.3, "y": 665.9, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-categories", "label": "Security Control Categories\n安全控制分類\n（依實施類型）", "content": "四種類型：管理控制、操作控制、技術控制、實體控制，形成一個由上而下的金字塔（管理在最上層提供監督）。", "table": "", "source": "p.27", "flow": null, "parent": "l1-seccontrols", "related": [], "x": 2024.3, "y": 549.6, "size": 44, "color": "#9E9E9E", "shape": "ellipse", "children": ["l1-sc-managerial", "l1-sc-operational", "l1-sc-technical", "l1-sc-physical"]}, {"id": "l1-iaaa-identification", "label": "Identification\n身分識別", "content": "建立唯一代表網路上的使用者、裝置或程序的帳戶或ID。「你是誰？」", "table": "", "source": "p.18", "flow": 1, "parent": "l1-iaaa", "related": [], "x": 1544.3, "y": 777, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-confidentiality", "label": "Confidentiality\n機密性", "content": "確保資料不得被未經授權之個人、實體或程序取得或揭露。\n威脅：密碼分析、社交工程、鍵盤記錄器、物聯網漏洞。\n防範：加密、安全傳輸協定、強密碼、存取控制。", "table": "", "source": "p.8", "flow": null, "parent": "l1-infosec", "related": [], "x": 631.6, "y": 772, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-sc-corrective", "label": "Corrective\n校正性控制", "content": "用於修復已發生的安全性問題，目標是消除或減少入侵事件的影響並恢復正常，包含事件回應、修補漏洞、系統還原。", "table": "範例：備份還原、安全補丁、事件回應計畫(IRP)、隔離受感染系統、事後檢討", "source": "p.35", "flow": 3, "parent": "l1-sc-functypes", "related": ["l1-incidentresponse-bu"], "x": 2347, "y": 670.9, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-iaaa", "label": "IAAA\n存取控制的核心\n（身分與存取管理 IAM）", "content": "現代存取控制通常作為身分和存取管理(IAM)系統實現，包括四個依序流程：\n識別→驗證→授權→可問責，因英文字首皆為A（除Identification外），也稱AAA或IAAA原則。\n\n範例（進辦公室）：\n1.識別：保全問名字 \n2.驗證：刷卡+臉部辨識 \n3.授權：只能進7樓 \n4.稽核：門禁系統記錄10:32刷進7樓。", "table": "", "source": "p.18,20", "flow": null, "parent": "l1-accesscontrol", "related": [], "x": 1647.1, "y": 585.7, "size": 44, "color": "#9E9E9E", "shape": "ellipse", "children": ["l1-iaaa-accounting", "l1-iaaa-authentication", "l1-iaaa-authorization", "l1-iaaa-identification"]}, {"id": "l1-roles", "label": "Information Security Roles and Responsibilities\n資訊安全角色和職責", "content": "資訊安全需仰賴跨部門集體參與，從高階主管到一般員工皆有對應責任，落實縱深防禦。\n角色包含整體責任(CIO/CSO/CISO)、管理層、技術層(ISSO)、非技術人員，以及應有的注意/責任(Due care/liability)。\n\n安全責任主要由董事或所有者承擔，但所有員工都分擔一定程度的責任——資安是同體同仁的責任。", "table": "", "source": "p.43-45", "flow": null, "parent": "l1-topic1b", "related": [], "x": 2842, "y": 467.8, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": ["l1-roles-executive", "l1-roles-nontech"]}, {"id": "l1-nist-protect", "label": "Protect\n保護", "content": "採購/開發、安裝、運營和退役IT硬體軟體資產，將安全作為運營生命週期每階段的嵌入式要求。", "table": "", "source": "p.12", "flow": 2, "parent": "l1-nistcsf", "related": [], "x": 1141.4, "y": 778.9, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-nist-recover", "label": "Recover\n恢復", "content": "如果其他控制措施無法阻止攻擊，實施網路安全彈性以恢復系統和數據。", "table": "", "source": "p.12", "flow": 5, "parent": "l1-nistcsf", "related": [], "x": 1337.9, "y": 777.6, "size": 40, "color": "#2196F3", "shape": "round-rectangle", "children": []}, {"id": "l1-topic1a", "label": "Topic 1A\nSecurity Concepts", "content": "涵蓋資安三要素(CIA Triad)、資安框架、差異分析與存取控制。", "table": "", "source": "p.3-4", "flow": null, "parent": "l1-root", "related": [], "x": 1292.5, "y": 286.3, "size": 75, "color": "#FFFFFF", "shape": "round-hexagon", "children": ["l1-infosec", "l1-csf", "l1-accesscontrol", "l1-gapanalysis"]}, {"id": "l1-gapanalysis", "label": "Gap Analysis\n差異分析", "content": "評估工具，用來比對企業的「資安現況」與「框架標準」之間的落差，以利後續改善。\n企業通常先挑選適合的Cyber security Framework作為評估基準，再透過Gap Analysis檢視自身不足。\n", "table": "範例（節錄）：\n| Function | Controls(Actual/Required) | Target Remediation |\n|---|---|---|\n| Identify(10/16) | Asset Management(4/6) | Q4 |\n| Identify(10/16) | Governance(3/4) | Q3 |\n| Identify(10/16) | Risk Assessment(3/6) | Q3 |\n| Protect(8/16) | Identity and Access Management(5/8) | Q1 |\n| Protect(8/16) | Data Security(3/8) | Q1 |", "source": "p.13-14", "flow": null, "parent": "l1-topic1a", "related": ["l1-sc-managerial"], "x": 1374.3, "y": 455.1, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": []}, {"id": "l1-competencies", "label": "Information Security Competencies\n資訊安全職能", "content": "承擔安全責任的IT專業人員須勝任從網路和應用程式設計到採購和HR的廣泛學科，\n典型活動包括：\n風險評估與測試、指定/採購/安裝/配置安全設備軟體、存取控制與用戶權限、稽核日誌與事件、事件回應與報告、業務連續性與災難恢復、安全培訓與教育計畫。\n企業或機構常藉此評估員工能力、制定招募標準或規劃培訓藍圖。", "table": "", "source": "p.46-47", "flow": null, "parent": "l1-topic1b", "related": ["l1-accesscontrol", "l1-sc-detective", "l1-incidentresponse-bu", "l1-sc-managerial", "l1-sc-operational"], "x": 3012.3, "y": 466.5, "size": 58, "color": "#D3D3D3", "shape": "diamond", "children": []}, {"id": "l1-nonrepud-vs-accountability", "label": "Non-repudiation vs Accountability\n不可否認性 vs 可問責性（比較）", "content": "不可否認性是「證據確鑿，無法賴帳」的技術機制；\n可問責性是「追究責任」的權責歸屬原則。", "table": "| 比較維度 | 不可否認性 | 可問責性 |\n|---|---|---|\n| 核心定義 | 確保發送/接收方無法否認曾執行某操作 | 確保每個實體的行為都能唯一追溯 |\n| 關注重點 | 行為的證據與證明力 | 行為的追蹤與究責 |\n| 常見技術手段 | 數位簽章、非對稱加密、時間戳記 | 系統日誌、身分驗證、存取控制 |\n| 舉例 | 自然人憑證簽署公文 | 系統日誌記錄帳號刪除資料庫的行為 |\n| 目的 | 防止抵賴，確保交易法律效力 | 維護系統安全、明確責任歸屬 |", "source": "p.19", "flow": null, "parent": "l1-accesscontrol", "related": ["l1-nonrepudiation", "l1-iaaa-accounting"], "x": 1772.4, "y": 516, "size": 44, "color": "#b28676", "shape": "round-pentagon", "children": []}]

function mdTableToHtml(md) {
  if (!md) return '';
  const lines = md.trim().split('\n').filter(l => l.includes('|'));
  if (lines.length < 2) return `<div style="white-space:pre-wrap;font-size:12.5px;color:#d7e4dc;margin-top:8px;">${md}</div>`;
  let rows = lines.filter((l,i) => !(i===1 && /^[\s|:-]+$/.test(l)));
  let html = '<table class="mdtable">';
  rows.forEach((row, i) => {
    const cells = row.split('|').map(c=>c.trim()).filter((c,idx,arr)=> !(idx===0 && c==='') && !(idx===arr.length-1 && c===''));
    const tag = i===0 ? 'th' : 'td';
    html += '<tr>' + cells.map(c=>`<${tag}>${c}</${tag}>`).join('') + '</tr>';
  });
  html += '</table>';
  return html;
}

function jumpBtn(target, container, isRelated) {
  const rn = GRAPH_DATA.find(x => x.id === target.id);
  const b = document.createElement('button');
  b.className = 'rel-btn' + (isRelated ? ' related-btn' : '');
  b.textContent = (isRelated ? '⇄ ' : (target.dir === 'up' ? '↑ ' : '↓ ')) + rn.label.split('\n')[0];
  b.onclick = () => {
    cy.elements().unselect();
    cy.$('#'+rn.id).select();
    showNode(rn.id);
    cy.animate({ center: { eles: cy.$('#'+rn.id) }, duration: 250 });
  };
  container.appendChild(b);
}

function showNode(id) {
  const n = GRAPH_DATA.find(x => x.id === id);
  if (!n) return;
  currentEditId = id;
  currentEdgeId = null;
  document.getElementById('sidebar').classList.add('visible');
  document.getElementById('edgeEditPanel').style.display = 'none';

  const node = cy.$('#'+id);
  const liveLabel = node.data('label');
  const liveContent = node.data('content');

  document.getElementById('nodeBadge').style.display = 'inline-block';
  document.getElementById('nodeMeta').style.display = 'block';
  document.getElementById('tableWrap').style.display = 'block';
  document.getElementById('nodeBadge').textContent = n.source ? ('來源：' + n.source) : '';
  document.getElementById('nodeTitle').textContent = liveLabel;
  document.getElementById('nodeMeta').textContent = n.flow ? ('流程步驟 #' + n.flow) : '';
  document.getElementById('nodeContent').textContent = liveContent || '（尚無內文）';
  document.getElementById('tableWrap').innerHTML = mdTableToHtml(n.table);

  document.getElementById('nodeTitle').style.display = editingMode ? 'none' : 'block';
  document.getElementById('nodeContent').style.display = editingMode ? 'none' : 'block';
  document.getElementById('editPanel').style.display = editingMode ? 'flex' : 'none';

  if (editingMode) {
    document.getElementById('editLabel').value = liveLabel;
    document.getElementById('editContent').value = liveContent;
    document.getElementById('editColor').value = node.data('color');
    document.getElementById('editSize').value = node.data('size');
    const shapeSelect = document.getElementById('editShape');
    shapeSelect.innerHTML = SHAPE_OPTIONS.map(o => `<option value="${o.en}">${o.zh}</option>`).join('');
    shapeSelect.value = node.data('shape');
  }

  const parentSection = document.getElementById('parentSection');
  const parentBtns = document.getElementById('parentBtns');
  parentBtns.innerHTML = '';
  if (n.parent) {
    parentSection.style.display = 'block';
    jumpBtn({id: n.parent, dir:'up'}, parentBtns, false);
  } else { parentSection.style.display = 'none'; }

  const childrenSection = document.getElementById('childrenSection');
  const childrenBtns = document.getElementById('childrenBtns');
  childrenBtns.innerHTML = '';
  if (n.children && n.children.length) {
    childrenSection.style.display = 'block';
    n.children.forEach(cid => jumpBtn({id: cid, dir:'down'}, childrenBtns, false));
  } else { childrenSection.style.display = 'none'; }

  const relSection = document.getElementById('relSection');
  const relBtns = document.getElementById('relBtns');
  relBtns.innerHTML = '';
  if (n.related && n.related.length) {
    relSection.style.display = 'block';
    n.related.forEach(rid => jumpBtn({id: rid}, relBtns, true));
  } else { relSection.style.display = 'none'; }
}

function showEdge(edgeId) {
  if (!editingMode) return; // view mode: clicking an edge does nothing (no empty panel)
  const edge = cy.$('#'+edgeId);
  if (!edge || edge.empty()) return;
  currentEdgeId = edgeId;
  currentEditId = null;
  document.getElementById('sidebar').classList.add('visible');

  // hide node-only sections
  ['nodeBadge','nodeTitle','nodeMeta','nodeContent','tableWrap','editPanel','parentSection','childrenSection','relSection']
    .forEach(elId => { document.getElementById(elId).style.display = 'none'; });

  document.getElementById('edgeEditPanel').style.display = 'flex';
  document.getElementById('edgeCurveStyle').value = edge.data('curveStyle');
  document.getElementById('edgeLineStyle').value = edge.data('lineStyle');
  document.getElementById('edgeWidth').value = edge.data('edgeWidth');
  document.getElementById('edgeColor').value = edge.data('lineColor');
  document.getElementById('edgeLabel').value = edge.data('edgeLabel') || '';
  document.getElementById('edgeSyncColor').checked = !!edge.data('syncColor');
}

function applyEdgeEdit(edgeId, field, newValue) {
  const edge = cy.$('#'+edgeId);
  undoStack.push({ kind: 'edge-style', id: edgeId, field, oldValue: edge.data(field) });
  edge.data(field, newValue);
  document.getElementById('exportBtn').disabled = false;
}

function syncEdgeColorToParent(edgeId) {
  const edge = cy.$('#'+edgeId);
  const parentNode = cy.$('#'+edge.data('source'));
  if (parentNode && !parentNode.empty()) {
    edge.data('lineColor', parentNode.data('color'));
  }
}

document.getElementById('edgeCurveStyle').addEventListener('change', (e) => {
  if (!currentEdgeId) return;
  applyEdgeEdit(currentEdgeId, 'curveStyle', e.target.value);
});
document.getElementById('edgeLineStyle').addEventListener('change', (e) => {
  if (!currentEdgeId) return;
  applyEdgeEdit(currentEdgeId, 'lineStyle', e.target.value);
});
document.getElementById('edgeWidth').addEventListener('input', (e) => {
  if (!currentEdgeId) return;
  const v = parseFloat(e.target.value);
  if (!isNaN(v)) applyEdgeEdit(currentEdgeId, 'edgeWidth', v);
});
document.getElementById('edgeColor').addEventListener('input', (e) => {
  if (!currentEdgeId) return;
  const edge = cy.$('#'+currentEdgeId);
  if (edge.data('syncColor')) {
    undoStack.push({ kind: 'edge-style', id: currentEdgeId, field: 'syncColor', oldValue: true });
    edge.data('syncColor', false);
    document.getElementById('edgeSyncColor').checked = false;
  }
  applyEdgeEdit(currentEdgeId, 'lineColor', e.target.value);
});
document.getElementById('edgeLabel').addEventListener('input', (e) => {
  if (!currentEdgeId) return;
  applyEdgeEdit(currentEdgeId, 'edgeLabel', e.target.value);
});
document.getElementById('edgeSyncColor').addEventListener('change', (e) => {
  if (!currentEdgeId) return;
  applyEdgeEdit(currentEdgeId, 'syncColor', e.target.checked);
  if (e.target.checked) {
    syncEdgeColorToParent(currentEdgeId);
    document.getElementById('edgeColor').value = cy.$('#'+currentEdgeId).data('lineColor');
  }
});

function applyEdit(id, field, newValue, pushUndo = true) {
  const node = cy.$('#'+id);
  if (pushUndo) {
    undoStack.push({ kind: 'node-data', id, field, oldValue: node.data(field) });
  }
  node.data(field, newValue);
  document.getElementById('exportBtn').disabled = false;

  // propagate color changes to child edges that are still synced
  if (field === 'color') {
    cy.edges(`[source = "${id}"]`).forEach(edge => {
      if (edge.data('syncColor')) {
        edge.data('lineColor', newValue);
        if (edge.id() === currentEdgeId) document.getElementById('edgeColor').value = newValue;
      }
    });
  }
}

document.getElementById('editLabel').addEventListener('input', (e) => {
  if (!currentEditId) return;
  applyEdit(currentEditId, 'label', e.target.value);
  document.getElementById('nodeTitle').textContent = e.target.value;
});
document.getElementById('editContent').addEventListener('input', (e) => {
  if (!currentEditId) return;
  applyEdit(currentEditId, 'content', e.target.value);
});
document.getElementById('editShape').addEventListener('change', (e) => {
  if (!currentEditId) return;
  applyEdit(currentEditId, 'shape', e.target.value);
});
document.getElementById('editColor').addEventListener('input', (e) => {
  if (!currentEditId) return;
  applyEdit(currentEditId, 'color', e.target.value);
});
document.getElementById('editSize').addEventListener('input', (e) => {
  if (!currentEditId) return;
  const v = parseFloat(e.target.value);
  if (!isNaN(v)) applyEdit(currentEditId, 'size', v);
});

document.getElementById('lockBtn').addEventListener('click', () => {
  editingMode = !editingMode;
  cy.autoungrabify(!editingMode); // only allow node dragging while editing
  const btn = document.getElementById('lockBtn');
  btn.textContent = editingMode ? '🔓' : '🔒';
  btn.classList.toggle('active', editingMode);
  document.getElementById('cy').classList.toggle('editing', editingMode);
  document.getElementById('editBanner').classList.toggle('visible', editingMode);
  if (currentEditId) showNode(currentEditId);
  else if (currentEdgeId) showEdge(currentEdgeId);
});

function pad(n) { return String(n).padStart(2, '0'); }

document.getElementById('exportBtn').addEventListener('click', () => {
  const changes = {};
  cy.nodes().forEach(node => {
    const id = node.id();
    const orig = ORIGINAL[id];
    if (!orig) return;
    const diff = {};
    ['label', 'content', 'shape', 'color', 'size'].forEach(field => {
      const cur = node.data(field);
      if (cur !== orig[field]) diff[field] = cur;
    });
    const pos = node.position();
    if (Math.round(pos.x*10)/10 !== orig.x || Math.round(pos.y*10)/10 !== orig.y) {
      diff.x = Math.round(pos.x*10)/10;
      diff.y = Math.round(pos.y*10)/10;
    }
    if (Object.keys(diff).length > 0) changes[id] = diff;
  });

  const edge_changes = {};
  cy.edges().forEach(edge => {
    const id = edge.id();
    const orig = ORIGINAL_EDGES[id];
    if (!orig) return;
    const diff = {};
    ['curveStyle', 'lineStyle', 'edgeWidth', 'lineColor', 'edgeLabel', 'syncColor'].forEach(field => {
      const cur = edge.data(field);
      if (cur !== orig[field]) diff[field] = cur;
    });
    if (Object.keys(diff).length > 0) edge_changes[id] = diff;
  });

  const payload = {
    version: MINDMAP_VERSION,
    exported_at: new Date().toISOString(),
    changes,
    edge_changes
  };

  const now = new Date();
  const ts = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const filename = `mindmap_${MINDMAP_VERSION}_${ts}.json`;

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

window.addEventListener('keydown', (e) => {
  const isUndo = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
  if (!isUndo || !editingMode) return;
  e.preventDefault();
  const action = undoStack.pop();
  if (!action) return;
  if (action.kind === 'node-pos') {
    cy.$('#'+action.id).position(action.oldValue);
  } else if (action.kind === 'edge-style') {
    cy.$('#'+action.id).data(action.field, action.oldValue);
    if (action.id === currentEdgeId) showEdge(action.id);
  } else {
    cy.$('#'+action.id).data(action.field, action.oldValue);
    if (action.id === currentEditId) showNode(action.id);
  }
});

cy.on('tap', 'node', (evt) => {
  cy.elements().unselect();
  evt.target.select();
  showNode(evt.target.id());
});

cy.on('tap', 'edge', (evt) => {
  if (!editingMode) return;
  cy.elements().unselect();
  evt.target.select();
  showEdge(evt.target.id());
});

cy.on('tap', (evt) => {
  if (evt.target === cy) {
    cy.elements().unselect();
    document.getElementById('sidebar').classList.remove('visible');
    currentEditId = null;
    currentEdgeId = null;
  }
});

cy.on('grab', 'node', (evt) => {
  dragStartPos = { x: evt.target.position('x'), y: evt.target.position('y') };
});
cy.on('dragfree', 'node', (evt) => {
  if (!editingMode || !dragStartPos) return;
  const node = evt.target;
  const newPos = node.position();
  if (newPos.x !== dragStartPos.x || newPos.y !== dragStartPos.y) {
    undoStack.push({ kind: 'node-pos', id: node.id(), field: 'position', oldValue: { ...dragStartPos } });
    document.getElementById('exportBtn').disabled = false;
  }
  dragStartPos = null;
});

// smooth WASD panning: hold a key to keep panning every animation frame
const heldKeys = new Set();
const PAN_SPEED = 12; // px per frame
window.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName !== 'BODY') return;
  const key = e.key.toLowerCase();
  if (['w','a','s','d'].includes(key)) heldKeys.add(key);
});
window.addEventListener('keyup', (e) => {
  heldKeys.delete(e.key.toLowerCase());
});
function panLoop() {
  if (heldKeys.size) {
    let dx = 0, dy = 0;
    if (heldKeys.has('w')) dy += PAN_SPEED;
    if (heldKeys.has('s')) dy -= PAN_SPEED;
    if (heldKeys.has('a')) dx += PAN_SPEED;
    if (heldKeys.has('d')) dx -= PAN_SPEED;
    if (dx !== 0 || dy !== 0) cy.panBy({ x: dx, y: dy });
  }
  requestAnimationFrame(panLoop);
}
requestAnimationFrame(panLoop);

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  cy.nodes().removeClass('dimmed');
  if (!q) return;
  cy.nodes().forEach(node => {
    const label = (node.data('label') || '').toLowerCase();
    const content = (node.data('content') || '').toLowerCase();
    if (!label.includes(q) && !content.includes(q)) node.addClass('dimmed');
  });
});
</script>
